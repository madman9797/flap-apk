name: Build Flappy Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK:"
          ls -la "$ANDROID_SDK_ROOT"

          echo "Command line tools:"
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"

          echo "sdkmanager:"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"

      - name: Download LÖVE Android
        run: |
          git clone \
            --depth 1 \
            --branch 11.5a \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/love2d/love-android.git \
            love-android

      - name: Put Flappy Maker into LÖVE
        run: |
          mkdir -p love-android/app/src/embed/assets
          cp game.love love-android/app/src/embed/assets/game.love

      - name: Configure Flappy Maker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("love-android/gradle.properties")

          lines = p.read_text().splitlines()

          remove_keys = {
              "app.name",
              "app.name_byte_array",
              "app.application_id",
              "app.version_code",
              "app.version_name",
          }

          new_lines = []

          for line in lines:
              if "=" in line:
                  key = line.split("=", 1)[0].strip()
                  if key in remove_keys:
                      continue

              new_lines.append(line)

          new_lines += [
              "app.name=Flappy Maker",
              "app.application_id=com.brocade.flappymaker",
              "app.version_code=20",
              "app.version_name=0.2.0"
          ]

          p.write_text("\n".join(new_lines) + "\n")
          PY

      - name: Build Flappy Maker APK
        working-directory: love-android
        run: |
          chmod +x gradlew
          ./gradlew assembleEmbedNoRecordRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find love-android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Maker-Android-APK
          path: love-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
